name: Release

# Builds a standalone Windows executable (no Python needed on the analyst's
# machine) whenever a version tag is pushed, smoke-tests it, and attaches it
# to a GitHub release for that tag.
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "from adforensictool.version import __version__; print(__version__)")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$version"; exit 1; }

      - name: Build executable
        run: >
          pyinstaller --noconfirm --clean --onefile --name adforensictool
          --add-data "adforensictool/rules/default_rules.yaml;adforensictool/rules"
          main.py

      - name: Smoke test
        shell: bash
        run: |
          ./dist/adforensictool.exe --version
          ./dist/adforensictool.exe --input tests/fixtures/empty.evtx --output smoke.xlsx --format xlsx,json \
            --timezone Europe/Sofia --sigma examples/sigma
          test -s smoke.xlsx && test -s smoke.json

      - uses: actions/upload-artifact@v4
        with:
          name: adforensictool-windows
          path: dist/adforensictool.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/adforensictool.exe
          generate_release_notes: true
