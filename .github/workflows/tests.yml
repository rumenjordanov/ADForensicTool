name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v --cov=adforensictool --cov-report=term-missing

      # Install the package the way a user would and run the installed
      # command from outside the checkout, so a missing package-data file
      # (rules YAML) or a broken entry point fails CI.
      - name: Smoke test installed CLI
        shell: bash
        run: |
          pip install .
          cd "$RUNNER_TEMP"
          adforensictool --version
          adforensictool --input "$GITHUB_WORKSPACE/tests/fixtures/empty.evtx" --output smoke.xlsx --format xlsx,json,csv,timeline
          test -s smoke.xlsx && test -s smoke.json && test -s smoke.csv && test -s smoke.timeline.csv
