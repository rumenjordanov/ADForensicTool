# Detection rules for ADForensicTool.
#
# Each rule has:
#   id                required, unique, used as a key elsewhere (correlator, excel tabs)
#   name              human-readable name shown in reports
#   severity          low | medium | high | critical
#   mitre_technique   MITRE ATT&CK technique ID (informational, shown in coverage tab)
#   type              threshold | always_flag | field_match | followed_by  (see rules/engine.py)
#   event_ids         list of Windows Event IDs this rule looks at
#   description       optional free text
#
# Conditions (optional on every rule type):
#   match:    list of conditions that must ALL hold
#   exclude:  list of conditions; an event matching ANY entry is dropped.
#             An entry can also be {all: [cond, cond]} to require several at once.
#   A condition is {field: <name>, <op>: <value or list of values>} where op is
#   one of equals | contains | startswith | endswith | regex. `field` names a
#   normalized column (user, user_sid, subject_user, target_group, source_ip,
#   target_host, logon_type, process_name) or else a raw EventData field.
#   Comparisons are case-insensitive; `equals` treats "0x17" and "0x00000017"
#   as the same number. A list of values means "any of these".
#
# type: threshold  -- flags a cluster of matching events for the same
#   group_by column within window_minutes of each other.
#   extra fields: group_by (normalized column), window_minutes, and
#   min_count (N+ events) and/or distinct_field + min_distinct (N+ different
#   values of that field, e.g. different usernames from one IP).
#
# type: always_flag -- flags every matching event unconditionally. Used for
#   events that are inherently suspicious regardless of frequency.
#
# type: field_match -- like always_flag, but requires conditions: either a
#   `match:` list or the short form `field: X` + `equals: [values]`.
#
# type: followed_by -- flags a matching event that occurs within
#   within_minutes AFTER an event flagged by one of the `after` rules, for
#   the same actor. extra fields: after (rule id or list), within_minutes,
#   join_on (column or list of columns compared between the two events,
#   default: user).

rules:
  - id: brute_force
    name: "Brute Force Login Attempts"
    severity: high
    mitre_technique: T1110
    type: threshold
    # 4625 (NTLM/interactive logon failure) and 4771 (Kerberos pre-auth
    # failure) are BOTH how a failed domain logon can show up, depending on
    # which protocol the client attempted -- a real brute-force tool can
    # trip either or both. Watching only 4625 misses Kerberos-based
    # attempts entirely, which was confirmed the hard way: failed logons
    # against a hostname (Kerberos) produced zero 4625s, while the same
    # attempts against the DC's bare IP (forcing NTLM) produced them
    # immediately. The threshold below counts either event ID toward the
    # same per-user cluster.
    event_ids: [4625, 4771]
    group_by: user
    window_minutes: 10
    min_count: 5

  - id: privilege_escalation
    name: "Privileged Group Membership Change"
    severity: critical
    mitre_technique: T1098
    type: always_flag
    event_ids: [4728, 4732, 4756]

  - id: audit_log_cleared
    name: "Security Audit Log Cleared"
    severity: critical
    mitre_technique: T1070.001
    type: always_flag
    event_ids: [1102]

  - id: kerberoasting
    name: "Kerberoasting (RC4 Service Ticket Request)"
    severity: high
    mitre_technique: T1558.003
    type: field_match
    event_ids: [4769]
    match:
      - field: TicketEncryptionType
        equals: ["0x17"]     # RC4-HMAC, crackable offline
      - field: Status
        equals: ["0x0"]      # ticket actually issued
    exclude:
      # RC4 tickets for krbtgt and for computer accounts are routine noise
      # (legacy clients, trusts) and are not crackable service passwords.
      - field: ServiceName
        equals: [krbtgt]
      - field: ServiceName
        endswith: ["$"]
      - field: TargetUserName  # machine accounts requesting tickets
        regex: ['^[^@]*\$(@|$)']

  # The two rules below describe multi-event-ID sequences (a logon following
  # a brute-force cluster; a service/task created shortly after a suspicious
  # logon). They are intentionally NOT expressible by the generic engine
  # above, which only ever looks at one rule's own event stream in
  # isolation. Stitching flagged events from *different* rules together
  # into a single narrative is exactly what correlator/chain_builder.py is
  # for -- see the TODOs there.
