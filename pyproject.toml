[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "adforensictool"
dynamic = ["version"]
description = "Reconstructs attacker narratives from Windows/Active Directory Security event logs (.evtx) into an analyst-ready Excel report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-evtx>=0.7.4",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "colorama>=0.4.6",
    "tzdata>=2023.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.5"]

[project.scripts]
adforensictool = "adforensictool.cli:main"

[tool.setuptools.dynamic]
version = { attr = "adforensictool.version.__version__" }

[tool.setuptools.packages.find]
include = ["adforensictool*"]

[tool.setuptools.package-data]
"adforensictool.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# sys.path tweak must precede the project imports so the script runs from a checkout
"examples/*.py" = ["E402"]
